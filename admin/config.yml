backend:
  name: github
  repo: tsx100/jaco-electrical-website
  branch: main
  base_url: https://decap-oauth.temitopesamuel11.workers.dev
  auth_endpoint: /auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    label_singular: "Product"
    description: "Manage your product catalog."
    files:
      - label: "All Products"
        name: "products"
        file: "products.json"
        format: json
        editor:
          preview: false
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — ₦{{fields.price}}"
            fields:
              - { label: "Product Name", name: "name", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Refrigerators", value: "refrigerator" }
                  - { label: "Air Conditioners", value: "ac" }
                  - { label: "Televisions", value: "tv" }
                  - { label: "Washing Machines", value: "washing" }
                  - { label: "Generators", value: "generator" }
                  - { label: "Kitchen Appliances", value: "microwave" }
                  - { label: "Fans & Cooling", value: "fan" }
                  - { label: "Audio Systems", value: "audio" }
              - { label: "Price (₦)", name: "price", widget: "number" }
              - { label: "Old Price (₦)", name: "oldPrice", widget: "number", required: false }
              - { label: "Icon (emoji)", name: "icon", widget: "string" }
              - { label: "Rating (1-5)", name: "rating", widget: "number", step: 0.1, min: 1, max: 5, required: false, default: 4.5 }
              - { label: "Number of Reviews", name: "reviews", widget: "number", required: false, default: 0 }
              - label: "Badge"
                name: "badge"
                widget: "select"
                required: false
                default: ""
                options:
                  - { label: "None", value: "" }
                  - { label: "SALE", value: "sale" }
                  - { label: "NEW", value: "new" }

  - name: "settings"
    label: "Site Settings"
    description: "Edit your business information and colors."
    files:
      - label: "Business Information"
        name: "site"
        file: "settings.json"
        format: json
        editor:
          preview: false
        fields:
          - { label: "Business Name", name: "businessName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Store Address", name: "address", widget: "string" }
          - { label: "WhatsApp Number", name: "whatsapp", widget: "string" }
          - { label: "Business Hours", name: "hours", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Announcement Bar Text", name: "announcementText", widget: "string" }
          - { label: "Products Sold Count", name: "productsSold", widget: "string" }
          - { label: "Happy Customers Count", name: "happyCustomers", widget: "string" }
          - { label: "Years of Experience", name: "yearsExperience", widget: "string" }
          - { label: "Facebook Link", name: "facebook", widget: "string", required: false }
          - { label: "Instagram Link", name: "instagram", widget: "string", required: false }
          - { label: "Twitter/X Link", name: "twitter", widget: "string", required: false }
          - { label: "Primary Color", name: "primaryColor", widget: "string" }
          - { label: "Primary Dark", name: "primaryDark", widget: "string" }
          - { label: "Primary Light", name: "primaryLight", widget: "string" }
          - { label: "Accent Color", name: "accentColor", widget: "string" }
          - { label: "Accent Dark", name: "accentDark", widget: "string" }
